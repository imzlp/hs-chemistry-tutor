<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="基于规范化学概念、公式与方程审核数据构建的高中化学辅助教学原型">
  <title>高中化学教学台 · 规范概念原型</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <button class="hamburger" id="hamburger" type="button" aria-label="打开目录"
      aria-controls="sidebar" aria-expanded="false">☰</button>
    <a class="brand" id="brandLink" href="#" aria-label="返回概览">
      <span class="brand-mark">化</span>
      <span>
        <span class="brand-title">高中化学教学台</span>
        <span class="brand-sub">Canonical Concept Prototype</span>
      </span>
    </a>
    <div class="book-picker">
      <select id="bookSelect" aria-label="选择教材范围"></select>
    </div>
    <div class="searchbox">
      <span class="search-icon">⌕</span>
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
        placeholder="搜索概念、别名、化学式、方程式…" aria-label="搜索知识点">
      <span class="search-key">/</span>
    </div>
    <div class="mode-switch" role="group" aria-label="切换教学视角">
      <button type="button" data-mode="student">学生</button>
      <button type="button" data-mode="teacher">教师</button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebarClose" type="button" aria-label="关闭目录">×</button>
      <div class="sidebar-head" id="sidebarStats"></div>
      <nav class="tree" id="tree" aria-label="教材概念目录"></nav>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>
    <div class="error-box">此原型需要启用 JavaScript 才能读取 JSONL 数据。</div>
  </noscript>
  <script src="app.js" defer></script>
</body>
</html>
